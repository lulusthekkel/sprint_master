<div class="container issue-container">
    <div class="sprint-title">
        <h3>
            Create new Sprint
            <button class="close-btn">
                <mat-icon aria-label='Close' (click)="dialogRef.close()">close</mat-icon>
            </button>
        </h3>
    </div>
    <div class="sprint-content mt-3">
        <div class="sprint-form">
            <form [formGroup]="sprintForm" (ngSubmit)="onSubmit()">
                <div class="row">
                    <div class="col-12 mb-1">
                        <label>Sprint Name:</label>
                    </div>
                    <div class="col-12">
                        <input type="text" class="form-control" formControlName="name"
                            placeholder="Enter sprint name" />
                        <div *ngIf="sprintForm.get('name')?.invalid && sprintForm.get('name')?.touched && isSubmitted"
                            class="text-danger">
                            Sprint name is required.
                        </div>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-12 mb-1">
                        <label>Goal:</label>
                    </div>
                    <div class="col-12">
                        <textarea class="form-control" formControlName="goal" placeholder="Enter sprint goal"></textarea>
                        <div *ngIf="sprintForm.get('goal')?.invalid && sprintForm.get('goal')?.touched && isSubmitted"
                            class="text-danger">
                            Sprint goal is required.
                        </div>
                    </div>
                </div>
                <div class="row mt-1">
                    <div class="col-12 mb-1">
                        <label>Start Date:</label>
                    </div>
                    <div class="col-12">
                        <mat-form-field appearance="fill" class="date">
                            <mat-label>Choose a date</mat-label>
                            <input matInput [matDatepicker]="startdate" placeholder="MM/DD/YYYY" formControlName="startdate">
                            <mat-datepicker-toggle matSuffix [for]="startdate"></mat-datepicker-toggle>
                            <mat-datepicker #startdate></mat-datepicker>
                        </mat-form-field>
                        <div *ngIf="sprintForm.get('startdate')?.invalid && sprintForm.get('startdate')?.touched  && isSubmitted"
                            class="text-danger">
                            Start date is required.
                        </div>
                    </div>
                </div>
               <div class="row mt-1">
                    <div class="col-12 mb-1">
                        <label>End Date:</label>
                    </div>
                    <div class="col-12">
                        <mat-form-field appearance="fill" class="date">
                            <mat-label>Choose a date</mat-label>
                            <input matInput [matDatepicker]="enddate" placeholder="MM/DD/YYYY" formControlName="enddate">
                            <mat-datepicker-toggle matSuffix [for]="enddate"></mat-datepicker-toggle>
                            <mat-datepicker #enddate></mat-datepicker>
                        </mat-form-field>
                        <div *ngIf="sprintForm.get('enddate')?.invalid && sprintForm.get('enddate')?.touched  && isSubmitted"
                            class="text-danger">
                            End date is required.
                        </div>
                    </div>
                </div>
                <!-- <div class="row mt-2">
                    <div class="col-12 mb-1">
                        <label>Point:</label>
                    </div>
                    <div class="col-12">
                        <input type="number" class="form-control" formControlName="point"
                            placeholder="Enter story point" />
                        <div *ngIf="storyForm.get('point')?.invalid && storyForm.get('point')?.touched && isSubmitted"
                            class="text-danger">
                            Point is required.
                        </div>
                        <div *ngIf="storyForm.get('point')?.value && storyForm.get('point')?.hasError('oddNumber')"
                            class="text-danger">
                            Point must be oddNumber.
                        </div>
                    </div>
                </div> -->
                <div class="add-sprint mt-3">
                    <button type="submit" class="add-button">
                        Create Sprint
                    </button>
                </div>
            </form>
        </div>
    </div>
