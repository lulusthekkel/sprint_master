<div class="container-fluid p-0">
    <div class="d-flex flex-column h-100">
        <div class="header px-2">
            <app-header></app-header>
        </div>
        <div class="main-section h-100">
            <div class="row h-100 w-100 pt-5">
                <div class="col-md-2">
                    <div class="layout">
                        <aside class="side-nav">
                            <ul>
                                <li><a routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
                                        routerLink="/sprint"><span
                                            class="icon"><mat-icon>list</mat-icon></span>Sprints</a>
                                </li>
                                <li><a routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
                                        routerLink="/issues"><span
                                            class="icon"><mat-icon>bug_report</mat-icon></span>Issues</a>
                                </li>
                                <li><a routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
                                        routerLink="/reports"><span
                                            class="icon"><mat-icon>summarize</mat-icon></span>Reports</a></li>
                            </ul>
                        </aside>
                    </div>
                </div>
                <div class="col-md-10">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>

    </div>
</div>
