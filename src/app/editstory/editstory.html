<div class="container edit-container">
    <div class="edit-title">
        <h2>Edit Story</h2>
    </div>
    <div class="edit-content mt-3">
        <div class="edit-form">
            <mat-dialog-content>
                <form [formGroup]="editForm">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Name</mat-label>
                        <input matInput formControlName="name">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Description</mat-label>
                        <input matInput formControlName="description">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Status</mat-label>
                        <mat-select formControlName="status">
                            <mat-option *ngFor="let item of items2" [value]="item.label">{{ item.label }}</mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Severity</mat-label>
                        <mat-select formControlName="severity">
                            <mat-option *ngFor="let item of items1" [value]="item.label">{{ item.label }}</mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Point</mat-label>
                        <input matInput type="number" formControlName="point" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Sprint</mat-label>
                        <mat-select formControlName="sprint">
                            <mat-option *ngFor="let sprint of sprints" [value]="sprint.id">
                                {{ sprint.name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </form>
            </mat-dialog-content>
            <mat-dialog-actions class="buttons">
                <button mat-button (click)="onCancel()">Cancel</button>
                <button mat-button color="primary" (click)="onSave()">Save</button>
            </mat-dialog-actions>
        </div>
    </div>
</div>
